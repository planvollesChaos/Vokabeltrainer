.sent{font-size:26px;font-weight:700;margin:8px 0 2px}

.dots{display:inline-flex;gap:3px;vertical-align:middle}

.wl button{font:inherit;background:none;border:0;color:var(--ink);text-align:left;font-weight:700;cursor:pointer;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}

.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

a{color:var(--blue-deep)}

function chooseGaps(en){
  var tr=traps(en),gaps=[],i;
  if(tr.length){for(i=tr[0].a;i<tr[0].b&&gaps.length<2;i++)gaps.push(i);
    if(en.length>=7&&tr[1]){for(i=tr[1].a;i<tr[1].b&&gaps.length<3;i++)gaps.push(i);}}
  if(!gaps.length){var v=[];for(i=0;i<en.length;i++)if(/[aeiou]/i.test(en[i]))v.push(i);
    if(!v.length)for(i=0;i<en.length;i++)if(en[i]!==' ')v.push(i);
    gaps.push(v[Math.floor(Math.random()*v.length)]);}
  return gaps.sort(function(a,b){return a-b;});
}
var CONF={a:'e',e:'a i',i:'e y',o:'u a',u:'o',y:'i',c:'k s',k:'c',s:'c z',w:'v',v:'w',j:'g',g:'j',t:'d',d:'t',b:'p',p:'b'};

  need.forEach(function(l){(CONF[l]||'').split(' ').forEach(function(c){if(c)pool.push(c);});});
  'aeiou'.split('').forEach(function(c){pool.push(c);});
  var dis=shuffle(pool).filter(function(c,i,a){return a.indexOf(c)===i;}).slice(0,gaps.length+3-need.length>0?3:3);
  var tiles=shuffle(need.concat(dis)).map(function(l,i){return {l:l,id:i,used:false};});
